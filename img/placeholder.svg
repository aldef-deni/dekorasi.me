<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Gambar belum tersedia">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f4ef"/>
      <stop offset="55%" stop-color="#efeae0"/>
      <stop offset="100%" stop-color="#e4dccd"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2c079"/>
      <stop offset="50%" stop-color="#c1902f"/>
      <stop offset="100%" stop-color="#95691d"/>
    </linearGradient>
    <pattern id="grid" width="75" height="75" patternUnits="userSpaceOnUse">
      <path d="M75 0H0v75" fill="none" stroke="#b9a071" stroke-width="1" stroke-opacity=".16"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>

  <!-- Sudut dekoratif -->
  <path d="M80 172V80h92" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-opacity=".5"/>
  <path d="M1120 728v92h-92" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-opacity=".5"/>

  <!-- Marka heksagon (mengikuti logo) -->
  <g transform="translate(600 450)">
    <path d="M0-132 114.3-66v132L0 132-114.3 66V-66Z" fill="none" stroke="url(#gold)" stroke-width="3.5" stroke-opacity=".8"/>
    <path d="M0-70 60.6-35v70L0 70-60.6 35V-35Z" fill="url(#gold)" fill-opacity=".14"/>
    <path d="M-60.6-35 0 0v70" fill="none" stroke="url(#gold)" stroke-width="3" stroke-opacity=".65"/>
    <path d="M0 0 60.6-35" fill="none" stroke="url(#gold)" stroke-width="3" stroke-opacity=".65"/>
  </g>
</svg>
